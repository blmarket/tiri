# tiri's reading of Claude Code, layered over herdr's claude.toml (see
# ../README.md). `version` is the herdr manifest this overlay was reviewed
# against; loading fails when they differ, so an upstream update gets reviewed
# here before it ships.
id = "claude"
version = "2026.09.11.1"

# When a fan-out finishes, "Waiting for N background agents to finish" stays
# above the prompt box after the last subagent's row has gone, so the line
# alone does not mean work. Running subagents are read from their rows instead
# (`subagent_rows_working`).
disable = ["background_agents_working"]

# herdr's rule, raised above the live-turn status line (970). A turn parked on
# a permission dialog wants a human, whatever status line is still drawn above
# the dialog. Safe to raise because the rule reads only what follows the last
# horizontal rule, never transcript text quoting a dialog.
[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 975
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

# Background subagents still running. The main thread returns to the prompt
# box once it has launched them, so the prompt reads idle while they work.
# Claude Code lists each running subagent under the prompt box with its
# elapsed time and token count, and drops the row when it finishes; the
# `● main` row heading the list carries no counter. A dynamic workflow's row
# writes its elapsed time without a space between units.
#   ◯ general-purpose  Reading e2e_status rende…  3m 42s · ↓ 93.1k tokens
#   ◯ cmdq-future-series  ▰▰▰▰▰▰▱▱▱▱  5/8 · 55m58s · ↓ 1.5m tokens
[[rules]]
id = "subagent_rows_working"
state = "working"
priority = 965
region = "after_last_horizontal_rule"
visible_working = true
line_regex = ['^\s*[^\s\p{Alphabetic}\p{N}] .*\s(?:\d+[hms])+ · ↓ .* tokens\s*$']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

# Background shells still running after the turn ends. Claude Code adds them
# to the turn's summary line the way herdr's `background_mcp_task_working`
# reads MCP tasks, and starts a new turn when a shell exits.
#   ✻ Worked for 50m 6s · done 11:05 AM · 1 shell still running
[[rules]]
id = "background_shell_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
visible_working = true
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)shells?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
