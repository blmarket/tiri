# tiri's reading of Pi, layered over herdr's pi.toml (see ../README.md).
# `version` is the herdr manifest this overlay was reviewed against.
id = "pi"
version = "2026.10.01.1"

# Extension selectors and inputs replace Pi's editor box. They are where an
# active turn waits for a human, so they outrank a working indicator still
# visible above the box.
[[rules]]
id = "input_dialog_blocked"
state = "blocked"
priority = 200
region = "prompt_box_body"
visible_blocker = true
any = [
  { contains = ["navigate", "select", "cancel"] },
  { contains = ["submit", "cancel"] },
]

# Built-in pickers are navigation the user opened, not a turn asking for
# input: they keep the previous state while open.
[[rules]]
id = "picker"
state = "unknown"
priority = 150
region = "prompt_box_body"
skip_state_update = true
any = [
  { contains = ["resume session"] },
  { contains = ["select model"] },
  { contains = ["session tree"] },
]
