[workspace]
members = [
    "tiri-buffer",
    "tiri-cmdparse",
    "tiri-rt",
    "tiri-refbox",
    "tiri-sdbus",
    "tiri-sys",
    "tiri-vt",
]

[package]
name = "tiri"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "tiri"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
path = "src/main.rs"
name = "tiri"

[dependencies]
tiri-vt = { path = "tiri-vt" }
futures-core = "0.3"
tiri-cmdparse = { path = "tiri-cmdparse" }
tiri-rt = { path = "tiri-rt" }
tiri-sys = { path = "tiri-sys" }
tiri-buffer = { path = "tiri-buffer" }
libc = "0.2"
refbox = { package = "tiri-refbox", path = "tiri-refbox" }

[target.'cfg(target_os = "linux")'.dependencies]
systemd = { version = "0.10", default-features = false }
tiri-sdbus = { path = "tiri-sdbus" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

[lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
