[workspace]
members = [
    "tiri-agent",
    "tiri-buffer",
    "tiri-cmdparse",
    "tiri-rt",
    "tiri-refbox",
]

[package]
name = "tiri"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "tiri"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
path = "src/main.rs"
name = "tiri"

[dependencies]
tiri-agent = { path = "tiri-agent" }
futures-core = "0.3"
tiri-cmdparse = { path = "tiri-cmdparse" }
tiri-rt = { path = "tiri-rt" }
tiri-buffer = { path = "tiri-buffer" }
libc = "0.2"
refbox = { package = "tiri-refbox", path = "tiri-refbox" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

[lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"
