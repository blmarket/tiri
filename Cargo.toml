[workspace]
members = [
    "tiri-core",
    "tiri-cmds",
    "tiri-buffer",
    "tiri-cmdparse",
    "tiri-rt",
    "tiri-refbox",
    "tiri-sdbus",
    "tiri-sys",
    "tiri-vt",
]

[package]
name = "tiri"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "tiri"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
path = "src/main.rs"
name = "tiri"

[dependencies]
tiri-core = { path = "tiri-core" }
tiri-cmds = { path = "tiri-cmds" }

[dev-dependencies]
tiri-core = { path = "tiri-core", features = ["test-support"] }
tiri-cmds = { path = "tiri-cmds", features = ["test-support"] }
tiri-sys = { path = "tiri-sys" }
libc = "0.2"

syn = { version = "2", features = ["full", "visit"] }

[lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
